name: readme-render
# Bot B：数据快照合入 main 后，从快照渲染 README 并开 PR（merge 门控的自动 README diff）
on:
  push:
    branches: [main]
    paths: ['data/snapshots/**']
  schedule:
    # 每日 21:47 UTC（北京 05:47 低峰）：快照节流/星标榜覆盖等任何原因导致的 README 停更，
    # 由本调度兜底自愈（渲染幂等，无变化自动跳过）
    - cron: "47 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render README from latest snapshot
        run: python3 scripts/render-readme-from-snapshot.py

      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "readme-render-bot"
          git config user.email "readme-render-bot@users.noreply.github.com"
          if git diff --quiet README.md PLUGINS-ALL.md CHANGELOG.md data/latest.json data/plugins-all.json 'catalog/all' assets/tile-ok.svg assets/tile-adapt.svg assets/tile-test.svg; then
            echo "无变化（快照与 README 已对齐）"
            exit 0
          fi
          BR="readme/render-$(date -u +%Y%m%dT%H%M%SZ)"
          git checkout -b "$BR"
          python3 scripts/export-data.py .
          git add README.md PLUGINS-ALL.md CHANGELOG.md data/latest.json data/plugins-all.json catalog/all/ assets/tile-ok.svg assets/tile-adapt.svg assets/tile-test.svg
          git commit -m "readme-render: 从快照 $(ls -t data/snapshots | head -1 | sed 's/.json//') 渲染（Bot B，merge 门控）"
          git push origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "[Readme-Render-Bot] README 渲染自快照 $(ls -t data/snapshots | head -1 | sed 's/.json//')" \
            --body "PR 类别：bot README 渲染（豁免插件登记模板）。
            数据源：本仓 \`data/snapshots/\` 最新已合并快照（渲染器只读快照，不访问外部流）——数字对齐由 run_id 锚定保证。
            由 \`readme-render\` workflow 在快照合入 main 后自动触发。" \
            || echo "PR 已存在或创建失败，分支已推送"
          # 三重闸门守卫（P4b：统一 engine/distribution/merge_guard.py——head SHA 钉死
          # + 作者钉死 + 文件集合精确匹配；替代原内联白名单校验）
          python3 engine/distribution/merge_guard.py \
            --repo "$GITHUB_REPOSITORY" --pr "$BR" --expect-sha "$(git rev-parse HEAD)" \
            --author "${{ github.actor }}" \
            --expect-file README.md --expect-file PLUGINS-ALL.md --expect-file CHANGELOG.md \
            --expect-file data/latest.json --expect-file data/plugins-all.json \
            --expect-file 'catalog/all/*' \
            --expect-file assets/tile-ok.svg --expect-file assets/tile-adapt.svg --expect-file assets/tile-test.svg \
            || echo "[render] 留人工审"
          fi
