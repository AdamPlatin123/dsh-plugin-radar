name: data-freshness
# 数据新鲜度断警（P0 安全网）：两项指标各自开/关 issue，恢复后自动关闭。
# 盯的是 main 分支已发布状态（raw 直链，消费者视角），不受本 workflow 自身 checkout 快照影响。
#
# ① latest.json 的 generated_at 停更 >26h：渲染链路停摆。
#    阈值依据：readme-render 每日 21:47 UTC 兜底 + 数据同步近月 1-3 次/天，一个完整日更周期 + 2h 余量。
# ② snapshot_run_id 停更 >96h：快照生产停摆。
#    ① 单独防不住——readme-render 每日重渲同一份旧快照会刷新 generated_at
#    （2026-10-16 起快照停更 17 天，①始终判"新鲜"）。阈值依据：快照增量 <10 不推，
#    历史正常最长间隔约 72h（10-09→10-12），+24h 余量。
on:
  schedule:
    - cron: "41 * * * *"   # 每小时 :41，避开整点高峰
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

concurrency:
  group: data-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 latest.json 渲染新鲜度（26h）与快照新鲜度（96h）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail   # 不用 -e：拉取/解析失败必须落进告警分支而非静默终止（外审 P1）
          URL="https://raw.githubusercontent.com/${REPO}/main/data/latest.json"
          # 输出四个字段：generated_at、其年龄(h)、snapshot_run_id、其年龄(h)。
          # 拉取/解析失败或时间戳非法 → 对应年龄 999999 = 数据不可信 = 断警（二轮外审 P1）
          read -r GENERATED GEN_AGE SNAP SNAP_AGE < <(curl -fsSL --retry 3 "$URL" 2>/dev/null | python3 -c "
          import datetime as dt, json, sys
          def age(value, fmt):
              try:
                  t = dt.datetime.strptime(value, fmt).replace(tzinfo=dt.timezone.utc)
                  return round((dt.datetime.now(dt.timezone.utc) - t).total_seconds() / 3600, 1)
              except (TypeError, ValueError):
                  return 999999
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = {}
          gen, snap = d.get('generated_at') or '(unavailable)', d.get('snapshot_run_id') or '(unavailable)'
          print(gen, age(gen, '%Y-%m-%dT%H:%M:%SZ'), snap, age(snap, '%Y%m%dT%H%M%SZ'))
          " || echo "(unavailable) 999999 (unavailable) 999999")
          echo "generated_at=${GENERATED}（${GEN_AGE}h）snapshot_run_id=${SNAP}（${SNAP_AGE}h）"
          gh label create radar-alert --color d73a4a --description "自动化断警（alerts workflow 自动开关）" 2>/dev/null || true

          # alert <标题> <年龄h> <阈值h> <正文>：超阈值开/续 issue，恢复则关闭
          alert() {
            local title="$1" age="$2" limit="$3" body="$4" open_num stale
            open_num=$(gh issue list -R "$REPO" --state open --label radar-alert \
              --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1 || true)
            stale=$(python3 -c "print(1 if float('$age') > $limit else 0)")
            if [ "$stale" = "1" ]; then
              if [ -n "$open_num" ]; then
                gh issue comment -R "$REPO" "$open_num" --body "仍停更：${age}h"
              else
                gh issue create -R "$REPO" --title "$title" --label radar-alert --body "$body"
              fi
            elif [ -n "$open_num" ]; then
              echo "已恢复（${age}h），关闭告警 #$open_num"
              gh issue comment -R "$REPO" "$open_num" --body "已恢复：${age}h"
              gh issue close -R "$REPO" "$open_num" --reason completed
            else
              echo "正常（${age}h ≤ ${limit}h）：$title"
            fi
          }

          alert "[radar-alert] 数据新鲜度：latest.json 停更超 26h" "$GEN_AGE" 26 \
          "**数据新鲜度断警**：main 分支 latest.json 已 ${GEN_AGE}h 未更新（generated_at=${GENERATED}）。
          - 指针：${URL}
          - 可能原因：服务器快照推送停摆 / org→mirror 同步失败 / readme-render 兜底未生效
          恢复后本告警自动关闭。"

          alert "[radar-alert] 快照新鲜度：snapshot_run_id 停更超 96h" "$SNAP_AGE" 96 \
          "**快照新鲜度断警**：main 分支 latest.json 指向的快照已 ${SNAP_AGE}h 未推进（snapshot_run_id=${SNAP}）。
          - 指针：${URL}
          - 含义：渲染仍可能每日刷新 generated_at，但快照生产已停——服务器管线 / 快照推送 / bot 凭据需排查
          恢复后本告警自动关闭。"
